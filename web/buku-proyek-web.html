<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Proyek</title>
<meta name="description" content="Aplikasi pembukuan proyek kontraktor: Owner, Admin-Finance, Mandor — versi web">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F1;--ink:#0B1410;--green:#0F2E24;--lime:#C8F26B;--mute:#5B665F;--mute2:#8A948E;--line:#F1F2EE;--card:#FFFFFF;--field:#FFFFFF;--fieldbd:#D5DBD6;--ok:#1F7A4D;--okbg:#E9F7D3;--okink:#2E4A0E;--warn:#F59E0B;--warnbg:#FFF1D6;--warnink:#7A4A00;--bad:#C0262D;--badbg:#FDE7E6;--badink:#8F1D22;--blue:#2A3FB0;--bluebg:#E7ECFF;--grey:#ECEEE9;--greyink:#3A4640;--track:#ECEEE9;--shadow:0 1px 2px rgba(11,20,16,.05),0 6px 18px rgba(11,20,16,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:24px;font-weight:800}h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:700}
.muted{color:var(--mute)}.muted2{color:var(--mute2)}.small{font-size:13px}.tiny{font-size:11px}.b{font-weight:700}.xb{font-weight:800}
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:16px;text-align:center}
.row{display:flex;gap:8px;align-items:center}.row.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:4px}.grow{flex:1 1 auto;min-width:0}.right{text-align:right}
svg{flex-shrink:0}

/* ---- kerangka ---- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.page{flex:1 1 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.hdr .who{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--lime);color:#0B1410;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.hdr .greet{font-size:13px;color:var(--mute)}.hdr .name{font-size:17px;font-weight:700}
.hdr .date{font-size:13px;color:var(--mute)}.hdr .title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.iconbtn{position:relative;width:44px;height:44px;border-radius:22px;border:none;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:5px;background:#E5484D;border:2px solid #fff}

/* ---- nav bawah (HP) ---- */
.nav{position:fixed;left:14px;right:14px;bottom:14px;max-width:532px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;background:#0B1410;border-radius:30px;padding:8px;box-shadow:0 14px 34px rgba(11,20,16,.3);z-index:5}
.nav button{min-height:56px;border-radius:22px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#B7CBC1}
.nav button.on{background:rgba(255,255,255,.1);color:var(--lime)}
.nav .fab{position:relative;width:60px;height:60px;margin:0 auto;border-radius:30px;background:var(--lime);color:#0B1410}
.nav .fab.on{background:var(--lime);color:#0B1410}
.nav .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:#E5484D;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0B1410;padding:0 5px}

/* ---- desktop (admin) ---- */
.shell.desk{flex-direction:row;background:var(--bg)}
.side{flex:0 0 232px;background:var(--green);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;min-height:100vh;position:sticky;top:0;align-self:flex-start}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}.side .logo{width:36px;height:36px;border-radius:11px;background:var(--lime);color:#0B1410;display:flex;align-items:center;justify-content:center;font-weight:800}
.side button{min-height:42px;border:none;border-radius:12px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#D5E2DB}
.side button.on{background:rgba(200,242,107,.16);color:var(--lime)}
.side .sbadge{background:#E5484D;color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 7px}
.side .me{margin-top:auto;padding:16px 8px 0;display:flex;flex-direction:column;gap:8px}
.side .mecard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.shell.desk .page{max-width:none;padding:24px 28px 40px;gap:18px}
.shell.desk .hdr .title{font-size:26px}
@media(max-width:899px){.shell.desk{flex-direction:column}.side{position:static;min-height:0;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px}.side .brand{padding:0 8px 0}.side .me{margin-top:0;padding:0;margin-left:auto}.side button{min-height:36px}.shell.desk .page{padding:16px 16px 40px;max-width:none}}

/* ---- kartu ---- */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--green);color:#fff}.card.dark .muted{color:#A9C7B8}
.card.ok{background:var(--okbg);color:var(--okink);box-shadow:none}.card.warn{background:var(--warnbg);color:var(--warnink);box-shadow:none}.card.bad{background:var(--badbg);color:var(--badink);box-shadow:none}.card.blue{background:var(--bluebg);color:#1E2C80;box-shadow:none}.card.grey{background:var(--grey);color:var(--greyink);box-shadow:none}
.hero{position:relative;overflow:hidden;background:var(--green);color:#fff;border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:110px;background:#1B4A3A}
.hero:after{content:"";position:absolute;right:20px;bottom:-90px;width:160px;height:160px;border-radius:80px;background:#174032}
.hero:before,.hero:after{z-index:0}.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;font-weight:600;color:#A9C7B8}.hero .big{font-size:38px;line-height:1.05;letter-spacing:-.03em;font-weight:800}.hero .sub{font-size:13px;color:#A9C7B8}
.hero .minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .mini{background:rgba(255,255,255,.1);border:none;border-radius:16px;padding:10px 12px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column}.hero .mini span{font-size:11px;color:#A9C7B8}.hero .mini b{font-size:15px}.hero .mini b.lime{color:var(--lime)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700}
.quick .circ{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.quick .circ.lime{background:var(--lime)}
.todo{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:none;border-radius:20px;padding:12px 14px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);width:100%}
.todo .ico{flex-shrink:0;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.todo .ico i{width:10px;height:10px;border-radius:5px;display:block}
.todo .t{font-size:15px;font-weight:700}.todo .s{font-size:13px;color:var(--mute)}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sect button{background:none;border:none;font-size:13px;font-weight:700;color:var(--green);cursor:pointer;min-height:36px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px}
.pcard{flex-shrink:0;width:230px;background:var(--card);border:none;border-radius:24px;padding:16px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard .chip{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.pcard .chip i{width:7px;height:7px;border-radius:4px;display:block;background:currentColor}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--track)}.pbar>span{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--green)}.pbar>i{position:absolute;top:-2px;width:3px;height:12px;background:var(--warn)}
.pcard .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--grey);padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:104px;border-radius:22px;border:none;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tile.lime{background:var(--lime)}.tile.dark{background:var(--green);color:#fff}
.tile b.l{font-size:16px}.tile span.s{font-size:12px;opacity:.8}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;border:none;text-align:left;box-shadow:var(--shadow)}.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:12px;color:var(--mute)}
.kpi.dark{background:var(--green);color:#fff}.kpi.dark .l{color:#A9C7B8}.kpi.ok{background:var(--okbg);color:var(--okink)}.kpi.ok .l{color:var(--okink)}.kpi.bad{background:var(--badbg);color:var(--badink)}.kpi.bad .l{color:var(--badink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okink)}.pill.warn{background:var(--warnbg);color:var(--warnink)}.pill.bad{background:var(--badbg);color:var(--badink)}.pill.blue{background:var(--bluebg);color:var(--blue)}.pill.grey{background:var(--grey);color:var(--greyink)}.pill.lime{background:var(--lime);color:#0B1410}
.list>*{padding:8px 0;border-top:1px solid var(--line)}.list>*:first-child{border-top:none;padding-top:0}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.bar>span{display:block;height:100%;background:var(--green)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--grey);border-radius:18px;padding:12px 14px;font-size:12px;color:var(--greyink)}

/* ---- kontrol ---- */
.btn{min-height:56px;border-radius:18px;border:none;background:var(--green);color:#fff;font-size:17px;font-weight:800;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.lime{background:var(--lime);color:#0B1410}.btn.ghost{background:var(--card);color:var(--green);border:2px solid var(--green)}.btn.danger{background:var(--card);color:var(--bad);border:2px solid var(--bad)}.btn.white{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.card>.btn.sm{align-self:flex-start}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:700;color:var(--mute)}
input,select,textarea{min-height:52px;border-radius:14px;border:2px solid var(--fieldbd);background:var(--field);padding:0 14px;font-size:17px;width:100%}textarea{padding:12px 14px;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
input.sm{min-height:40px;font-size:15px;padding:0 10px;border-radius:10px}input.num{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid #E1E5E1;background:var(--card);font-weight:700;cursor:pointer;font-size:14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--grey)}.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--grey)}.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--fieldbd);background:var(--card);font-size:20px;font-weight:800;cursor:pointer}.stepper b{min-width:52px;text-align:center;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-align:left;color:#fff;background:var(--green);padding:8px 10px}th:first-child{border-radius:10px 0 0 0}th:last-child{border-radius:0 10px 0 0}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.num{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:20;max-width:528px;margin:0 auto;background:var(--okbg);color:var(--okink);border-radius:16px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(11,20,16,.15)}.toast.bad{background:var(--badbg);color:var(--badink)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--green)}
.login .card{width:100%;max-width:380px;gap:14px;border-radius:28px;padding:22px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.roles button{min-height:72px;border-radius:16px;border:2px solid #E1E5E1;background:var(--card);font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.roles button span{font-size:11px;font-weight:600;color:var(--mute)}.roles button.on{border-color:var(--green);background:var(--okbg);color:var(--okink)}
.kopt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border-radius:16px;border:2px solid #E3E5DF;background:var(--card);color:var(--ink);cursor:pointer}.kopt.on{background:var(--green);color:#fff;border-color:var(--green)}.kopt .col{flex:1 1 170px}.kopt .pill{margin-left:auto}.kopt.on .pill.grey{background:rgba(255,255,255,.15);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:12px;border:none;background:var(--card);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}.tabs button.on{background:var(--green);color:var(--lime)}

</style>
</head>
<body>
<div id="app"><div class="center muted">Memuat Buku Proyek…</div></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Adapter data untuk versi web (claude.ai Artifact): penyimpanan db + assets, hitungan di sisi klien.
   Antarmuka sama dengan public/api.js. Dibangun jadi satu file HTML oleh web/build.js. */
'use strict';
window.API = (() => {
  let dbh = null, assetsh = null, user = null;
  const D = { config: null, matrix: null, log: [], projects: [], attendance: [], reports: [], notas: [], invoices: [] };
  const DEFAULT_CFG = { approvalLimit: 10000000, siteRadiusM: 300, ppn: 0.11, pph: 0.0265, overhead: 0.04, bunga: 0.012 };
  const CFG = () => Object.assign({}, DEFAULT_CFG, D.config || {});
  const now = () => new Date().toISOString();
  const nid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fail = (m) => { throw new Error(m); };
  const rp = (v) => 'Rp ' + Math.round(Math.abs(v || 0)).toLocaleString('id-ID');
  async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join(''); }
  const remember = (k, v) => { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const recall = (k) => { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } };
  function shrink(file, max = 1024) { return new Promise((res, rej) => { const im = new Image(); const url = window.URL.createObjectURL(file); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); window.URL.revokeObjectURL(url); c.toBlob((b) => b ? res(b) : rej(new Error('gagal')), 'image/jpeg', 0.72); }; im.onerror = rej; im.src = url; }); }
  async function upload(file, max) { if (!assetsh) fail('Unggah foto tidak aktif: akun ini hanya punya akses "lihat" pada halaman ini.'); const blob = await shrink(file, max); const r = await assetsh.upload(blob, { type: 'image/jpeg' }); return r.id; }
  async function put(coll, id, obj) { await dbh.doc(coll + '/' + id).set(obj); }
  async function logEv(text, projectId) { const items = [{ id: nid('l'), ts: now(), who: user ? user.name : 'Sistem', text, projectId: projectId || null }].concat(D.log).slice(0, 200); D.log = items; await dbh.doc('app/log').set({ items }); }
  const changed = () => { if (window.onDataChange) window.onDataChange(); };

  // ---- hitungan (sama dengan server.js) ----
  const rapOf = (p) => p.divisions.reduce((a, d) => a + d.rap, 0), voSum = (p) => (p.vos || []).filter((v) => v.status === 'ok').reduce((a, v) => a + v.price, 0), contractOf = (p) => rapOf(p) * (1 + p.buk / 100) + voSum(p);
  const progressOf = (p, k) => { const r = rapOf(p); return r ? p.divisions.reduce((a, d) => a + d.rap * (d[k] || 0) / 100, 0) / r : 0; };
  function summary(p) {
    const C = CFG(), K = contractOf(p), rap = rapOf(p), cut = C.overhead + C.bunga + C.pph, prog = progressOf(p, 'progress'), vprog = progressOf(p, 'verified');
    const ap = D.notas.filter((n) => n.projectId === p.id && n.status === 'approved'), approved = ap.reduce((a, n) => a + n.amount, 0), extra = ap.reduce((a, n) => a + (n.overMarket || 0), 0);
    const paid = D.invoices.filter((i) => i.projectId === p.id && i.status === 'paid'), dpIn = paid.find((i) => i.termin === 0) ? K * p.dp * (1 - C.pph) : 0;
    const kas = (p.kasAwal || 0) + dpIn + paid.filter((i) => i.termin > 0).reduce((a, i) => a + i.net - i.pph, 0) - approved;
    const labaAkhir = K - rap - extra - K * cut, floorBuk = Math.ceil((1 / (1 - cut) - 1) * 100), net = K ? (K - rap - K * cut) / K : 0;
    const zone = p.buk < floorBuk ? 'Rugi' : net < 0.05 ? 'Tipis' : p.buk > (p.offer ? 25 : 20) ? 'Di atas wajar' : 'Aman';  // proyek dari Konsultan: margin sudah memuat cadangan risiko
    return { contract: K, vo: voSum(p), rap, progress: prog, verified: vprog, spent: approved, overMarket: extra, kas, labaAkhir, labaPct: K ? labaAkhir / K : 0, net, zone, floorBuk, revenue: vprog * K, pendingN: D.notas.filter((n) => n.projectId === p.id && (n.status === 'pending' || n.status === 'owner')).length, receivable: D.invoices.filter((i) => i.projectId === p.id && i.status === 'sent').reduce((a, i) => a + i.transfer, 0) };
  }
  function invoiceCalc(p, termin, progressPct) {
    const C = CFG(), K = contractOf(p);
    if (termin === 0) { const dp = K * p.dp; return { termin: 0, label: 'Uang muka (DP)', bruto: dp, potDP: 0, retensi: 0, net: dp, ppn: dp * C.ppn, pph: dp * C.pph, transfer: dp + dp * C.ppn - dp * C.pph }; }
    const t = p.termins.find((x) => x.n === termin), bruto = t.pct * K, potDP = p.dp * bruto, retensi = p.retensi * bruto, net = bruto - potDP - retensi, dasar = bruto - potDP;
    return { termin, label: t.label, progressPct, bruto, potDP, retensi, net, ppn: dasar * C.ppn, pph: dasar * C.pph, transfer: net + dasar * C.ppn - dasar * C.pph };
  }
  function distM(a, b, c, d) { const R = 6371e3, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r; const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
  const canMoney = () => user && user.role !== 'mandor';

        card('<h3>Simpan sebagai proyek</h3><span class="small muted">RAB awal dibuat dari rincian di atas (biaya modal per pekerjaan + margin). Admin bisa merapikan angkanya sebelum dikirim ke klien.</span><div class="field"><label>Nama proyek</label><input id="kNama" value="' + esc(s.nama || '') + '" placeholder="mis. Ruko 3 Lantai Bekasi"></div><div class="field"><label>Klien</label><input id="kKlien" value="' + esc(s.klienNama || '') + '" placeholder="mis. PT Sinar Abadi"></div><button class="btn full" onclick="KONSULTAN.save()">Simpan proyek & RAB awal</button><button class="btn ghost full" onclick="' + set(Object.assign(defaults(), { step: 1 })) + '">Hitung ulang dari awal</button>');
    }
    const meter = s.step < 7 ? '<div class="card dark" style="gap:6px"><div class="row between"><span class="tiny" style="color:#A9C7B8">Perkiraan sejauh ini · ketelitian ' + r.meter.acc + '</span><span class="tiny" style="color:#A9C7B8">' + (7 - s.step) + ' pertanyaan lagi</span></div><b style="font-size:20px;color:var(--lime)">' + r.meter.range + '</b><div class="row" style="gap:3px">' + [0, 1, 2, 3, 4, 5].map((i) => '<span style="flex:1 1 0;height:4px;border-radius:2px;background:' + (i <= r.meter.ai ? 'var(--lime)' : '#2A3530') + '"></span>').join('') + '</div></div>' : '';
    return '<div class="col" style="gap:2px"><span class="tiny b muted">' + esc(LABELS[s.step - 1]) + '</span>' + dots + '</div>' + body + meter;
  }

  function toProject(s, nama, klien) {
    const r = calc(s), t = r.target;
    const divisions = r.works.map((w) => ({ name: w.label, rap: Math.round(w.v * 1e6 * (1 + r.risiko / 100)) }));  // cadangan risiko dimasukkan ke RAP
    const rapSum = divisions.reduce((a, d) => a + d.rap, 0);

  }
  return { defaults, calc, view, toProject, LABELS, set: null, save: null };
})();

function rabView() {
  const p = P(); if (!p) return hdrTitle('RAB & penawaran') + '<button class="btn" onclick="A.newProject()">+ Proyek baru</button>'; const s = p.summary, C = S.config;

function lapanganView() {

/* ---------- MANDOR ---------- */

  const ab = S.attendance.filter((a) => a.projectId === p.id && a.ts.slice(0, 10) === today()); const masuk = ab.find((a) => a.type === 'masuk'), pulang = ab.find((a) => a.type === 'pulang');
  const items = S.reports.filter((r) => r.projectId === p.id).map((r) => ({ ts: r.ts, t: 'Laporan progres · ' + r.items.map((it) => (p.divisions[it.div] || {}).name + ' ' + it.pct + '%').join(', '), s: r.photos.length + ' foto', pill: r.verified ? pill('Diverifikasi', 'ok') : pill('Menunggu verifikasi', 'warn') }))
    .concat(S.notas.filter((n) => n.projectId === p.id).map((n) => ({ ts: n.ts, t: 'Nota · ' + (n.desc || n.type) + ' ' + rp(n.amount), s: n.note || '', pill: statusPill(n) }))).sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 20);

    : '<div class="card dark" style="border-radius:24px;padding:18px"><span class="small b" style="color:#A9C7B8">Absensi saya</span><b style="font-size:22px;line-height:1.2">Belum absen hari ini</b><span class="small" style="color:#A9C7B8">Selfie + lokasi. Laporan progres hanya bisa dikirim setelah absen di lokasi.</span><button class="btn lime" onclick="A.go(\'absen\')">Absen masuk sekarang</button></div>';
  return hdrTitle('Pagi, ' + S.user.name.replace(/^Pak |^Bu /, ''), hariIni(), pill('Mandor · ' + p.name, 'warn')) + abCard +
    (API.canUpload() ? '' : card('<b>Unggah foto tidak aktif</b><span class="small">Akun ini hanya punya akses "lihat". Minta Owner membagikan halaman ini dengan akses "dapat mengedit".</span>', 'warn')) +
    '<div class="tiles"><button class="tile lime" onclick="A.go(\'lapor\')">' + I.cam + '<span class="col" style="gap:0"><b class="l">Lapor progres</b><span class="s">foto pekerjaan hari ini</span></span></button><button class="tile" onclick="A.go(\'nota\')">' + I.nota + '<span class="col" style="gap:0"><b class="l">Kirim nota</b><span class="s">belanja & upah</span></span></button></div>' +
    card('<b style="font-size:15px">Laporan saya</b><div class="list">' + (items.length ? items.map((x) => '<div class="row between"><span class="col grow" style="gap:0"><b class="small">' + esc(x.t) + '</b><span class="tiny muted">' + tgl(x.ts) + (x.s ? ' · ' + esc(x.s) : '') + '</span></span>' + x.pill + '</div>').join('') : '<span class="muted small">Belum ada kiriman.</span>') + '</div>') +
    '<div class="note">' + I.lock + '<span>Akun mandor: absen, lapor progres, kirim nota, dan foto untuk proyek ' + esc(p.name) + '. Nilai kontrak, harga RAB, dan keuangan hanya untuk Owner dan Admin.</span></div>';
}
function absenView() {
  const p = P(); const ab = S.attendance.filter((a) => a.projectId === p.id && a.ts.slice(0, 10) === today()); const type = ab.some((a) => a.type === 'masuk') ? 'pulang' : 'masuk';
  return hdrTitle('Absen ' + type, p.name) + card('<div class="field"><label>1 · Selfie di lokasi</label><input id="selfie" type="file" accept="image/*" capture="user" onchange="this.nextElementSibling.src=window.URL.createObjectURL(this.files[0])"><img class="photo" alt="" style="margin-top:8px"></div>' + (type === 'masuk' ? '<div class="field"><label>2 · Jumlah tukang hadir hari ini</label><input id="workers" type="number" inputmode="numeric" min="0" placeholder="mis. 14"></div>' : '<input id="workers" type="hidden" value="0">') + '<span class="small muted">Lokasi GPS diambil otomatis saat tombol ditekan. Izinkan akses lokasi di browser.</span><button id="btnAbsen" class="btn lime full" onclick="A.absen(\'' + type + '\')">Kirim absen</button>');

/* ---------- render ---------- */
function render() {
  if (booting) { app.innerHTML = '<div class="center muted">Memuat Buku Proyek…</div>'; return; }
  if (bootError) { app.innerHTML = '<div class="center"><div class="card" style="max-width:420px"><h2>Tidak bisa memuat</h2><span class="small muted">' + esc(bootError) + '</span></div></div>'; return; }
  if (!S || !S.user) { app.innerHTML = loginView(); return; }
  const role = S.user.role; let body, nav = '';
  const pendOwner = S.notas.filter((n) => n.status === 'owner').length, pendAdmin = S.notas.filter((n) => n.status === 'pending').length;
  if (role === 'owner') { const nBukti = pendOwner + S.reports.filter((r) => !r.verified).length; nav = navBar([['home', 'Beranda', I.home], ['project', 'Proyek', I.proj], ['termin', 'Termin', I.termin], ['menu', 'Menu', I.menu]], ['bukti', 'Cek bukti', I.check, nBukti]); body = { home: ownerHome, project: projectView, laporan: laporanView, approve: approveView, bukti: buktiView, termin: tagihanView, penawaran: penawaranView, tambahkurang: voView, rab: rabView, harga: matrixView, lapangan: lapanganView, menu: menuView }[view] || ownerHome; }
  else if (role === 'admin') {
    const SECS = [['home', 'Dasbor', I.dash, 0], ['penawaran', 'Konsultan Penawaran', I.calc.replace('width="26" height="26"', 'width="22" height="22"'), 0], ['rab', 'RAB', I.rab, 0], ['tambahkurang', 'Tambah-kurang', I.send.replace('width="26" height="26"', 'width="22" height="22"'), S.projects.reduce((a, p) => a + (p.vos || []).filter((v) => v.status === 'risk').length, 0)], ['matrix', 'Matriks Harga', I.tag, 0], ['approve', 'Persetujuan biaya', I.nota, pendAdmin], ['lapangan', 'Laporan lapangan', I.field, S.reports.filter((r) => !r.verified).length], ['tagihan', 'Tagihan & Termin', I.termin, 0], ['menu', 'Pengaturan', I.user, 0]];
    body = { home: adminDash, penawaran: penawaranView, rab: rabView, tambahkurang: voView, matrix: matrixView, approve: approveView, lapangan: lapanganView, tagihan: tagihanView, menu: menuView }[view] || adminDash;
    const side = '<nav class="side"><div class="brand"><span class="logo">BP</span><span class="col" style="gap:0"><b style="font-size:15px">Buku Proyek</b><span class="tiny" style="color:#A9C7B8">Admin – Finance</span></span></div>' + SECS.map((x) => '<button class="' + (view === x[0] ? 'on' : '') + '" onclick="A.go(\'' + x[0] + '\')"><span class="row">' + x[2] + esc(x[1]) + '</span>' + (x[3] ? '<span class="sbadge">' + x[3] + '</span>' : '') + '</button>').join('') + '<div class="me"><span class="tiny" style="color:#A9C7B8">Masuk sebagai</span><div class="mecard"><span class="avatar" style="width:32px;height:32px;font-size:12px;background:#E7ECFF;color:#2A3FB0">' + initials(S.user.name) + '</span><span class="col" style="gap:0"><b class="small">' + esc(S.user.name) + '</b><span class="tiny" style="color:#A9C7B8">' + S.user.role + '</span></span></div></div></nav>';

  app.innerHTML = '<div class="shell"><main class="page">' + body() + '</main>' + nav + '</div>';
}
(async () => {
  render();
  try { const r = await API.init(); if (r && r.error) bootError = r.error; else { const u = await API.me(); if (u) { S = await API.state(); sel.pid = S.projects[0] && S.projects[0].id; } else if (API.kind === 'artifact') S = await API.state().catch(() => null); } } catch (e) { bootError = e.message; }
  booting = false; render();
})();
