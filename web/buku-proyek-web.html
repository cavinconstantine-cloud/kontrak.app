<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Proyek</title>
<meta name="description" content="Aplikasi pembukuan proyek kontraktor: Owner, Admin-Finance, Mandor — versi web">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F1;--ink:#0B1410;--green:#0F2E24;--lime:#C8F26B;--mute:#5B665F;--mute2:#8A948E;--line:#F1F2EE;--card:#FFFFFF;--field:#FFFFFF;--fieldbd:#D5DBD6;--ok:#1F7A4D;--okbg:#E9F7D3;--okink:#2E4A0E;--warn:#F59E0B;--warnbg:#FFF1D6;--warnink:#7A4A00;--bad:#C0262D;--badbg:#FDE7E6;--badink:#8F1D22;--blue:#2A3FB0;--bluebg:#E7ECFF;--grey:#ECEEE9;--greyink:#3A4640;--track:#ECEEE9;--shadow:0 1px 2px rgba(11,20,16,.05),0 6px 18px rgba(11,20,16,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:24px;font-weight:800}h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:700}
.muted{color:var(--mute)}.muted2{color:var(--mute2)}.small{font-size:13px}.tiny{font-size:11px}.b{font-weight:700}.xb{font-weight:800}
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:16px;text-align:center}
.row{display:flex;gap:8px;align-items:center}.row.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:4px}.grow{flex:1 1 auto;min-width:0}.right{text-align:right}
svg{flex-shrink:0}

/* ---- kerangka ---- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.page{flex:1 1 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.hdr .who{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--lime);color:#0B1410;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.hdr .greet{font-size:13px;color:var(--mute)}.hdr .name{font-size:17px;font-weight:700}
.hdr .date{font-size:13px;color:var(--mute)}.hdr .title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.iconbtn{position:relative;width:44px;height:44px;border-radius:22px;border:none;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:5px;background:#E5484D;border:2px solid #fff}

/* ---- nav bawah (HP) ---- */
.nav{position:fixed;left:14px;right:14px;bottom:14px;max-width:532px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;background:#0B1410;border-radius:30px;padding:8px;box-shadow:0 14px 34px rgba(11,20,16,.3);z-index:5}
.nav button{min-height:56px;border-radius:22px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#B7CBC1}
.nav button.on{background:rgba(255,255,255,.1);color:var(--lime)}
.nav .fab{position:relative;width:60px;height:60px;margin:0 auto;border-radius:30px;background:var(--lime);color:#0B1410}
.nav .fab.on{background:var(--lime);color:#0B1410}
.nav .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:#E5484D;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0B1410;padding:0 5px}

/* ---- desktop (admin) ---- */
.shell.desk{flex-direction:row;background:var(--bg)}
.side{flex:0 0 232px;background:var(--green);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;min-height:100vh;position:sticky;top:0;align-self:flex-start}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}.side .logo{width:36px;height:36px;border-radius:11px;background:var(--lime);color:#0B1410;display:flex;align-items:center;justify-content:center;font-weight:800}
.side button{min-height:42px;border:none;border-radius:12px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#D5E2DB}
.side button.on{background:rgba(200,242,107,.16);color:var(--lime)}
.side .sbadge{background:#E5484D;color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 7px}
.side .me{margin-top:auto;padding:16px 8px 0;display:flex;flex-direction:column;gap:8px}
.side .mecard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.shell.desk .page{max-width:none;padding:24px 28px 40px;gap:18px}
.shell.desk .hdr .title{font-size:26px}
@media(max-width:899px){.shell.desk{flex-direction:column}.side{position:static;min-height:0;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px}.side .brand{padding:0 8px 0}.side .me{margin-top:0;padding:0;margin-left:auto}.side button{min-height:36px}.shell.desk .page{padding:16px 16px 40px;max-width:none}}

/* ---- kartu ---- */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--green);color:#fff}.card.dark .muted{color:#A9C7B8}
.card.ok{background:var(--okbg);color:var(--okink);box-shadow:none}.card.warn{background:var(--warnbg);color:var(--warnink);box-shadow:none}.card.bad{background:var(--badbg);color:var(--badink);box-shadow:none}.card.blue{background:var(--bluebg);color:#1E2C80;box-shadow:none}.card.grey{background:var(--grey);color:var(--greyink);box-shadow:none}
.hero{position:relative;overflow:hidden;background:var(--green);color:#fff;border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:110px;background:#1B4A3A}
.hero:after{content:"";position:absolute;right:20px;bottom:-90px;width:160px;height:160px;border-radius:80px;background:#174032}
.hero:before,.hero:after{z-index:0}.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;font-weight:600;color:#A9C7B8}.hero .big{font-size:38px;line-height:1.05;letter-spacing:-.03em;font-weight:800}.hero .sub{font-size:13px;color:#A9C7B8}
.hero .minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .mini{background:rgba(255,255,255,.1);border:none;border-radius:16px;padding:10px 12px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column}.hero .mini span{font-size:11px;color:#A9C7B8}.hero .mini b{font-size:15px}.hero .mini b.lime{color:var(--lime)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700}
.quick .circ{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.quick .circ.lime{background:var(--lime)}
.todo{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:none;border-radius:20px;padding:12px 14px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);width:100%}
.todo .ico{flex-shrink:0;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.todo .ico i{width:10px;height:10px;border-radius:5px;display:block}
.todo .t{font-size:15px;font-weight:700}.todo .s{font-size:13px;color:var(--mute)}
.sect{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sect button{background:none;border:none;font-size:13px;font-weight:700;color:var(--green);cursor:pointer;min-height:36px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px}
.pcard{flex-shrink:0;width:230px;background:var(--card);border:none;border-radius:24px;padding:16px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard .chip{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.pcard .chip i{width:7px;height:7px;border-radius:4px;display:block;background:currentColor}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--track)}.pbar>span{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--green)}.pbar>i{position:absolute;top:-2px;width:3px;height:12px;background:var(--warn)}
.pcard .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--grey);padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:104px;border-radius:22px;border:none;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tile.lime{background:var(--lime)}.tile.dark{background:var(--green);color:#fff}
.tile b.l{font-size:16px}.tile span.s{font-size:12px;opacity:.8}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;border:none;text-align:left;box-shadow:var(--shadow)}.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:12px;color:var(--mute)}
.kpi.dark{background:var(--green);color:#fff}.kpi.dark .l{color:#A9C7B8}.kpi.ok{background:var(--okbg);color:var(--okink)}.kpi.ok .l{color:var(--okink)}.kpi.bad{background:var(--badbg);color:var(--badink)}.kpi.bad .l{color:var(--badink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okink)}.pill.warn{background:var(--warnbg);color:var(--warnink)}.pill.bad{background:var(--badbg);color:var(--badink)}.pill.blue{background:var(--bluebg);color:var(--blue)}.pill.grey{background:var(--grey);color:var(--greyink)}.pill.lime{background:var(--lime);color:#0B1410}
.list>*{padding:8px 0;border-top:1px solid var(--line)}.list>*:first-child{border-top:none;padding-top:0}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.bar>span{display:block;height:100%;background:var(--green)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--grey);border-radius:18px;padding:12px 14px;font-size:12px;color:var(--greyink)}

/* ---- kontrol ---- */
.btn{min-height:56px;border-radius:18px;border:none;background:var(--green);color:#fff;font-size:17px;font-weight:800;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.lime{background:var(--lime);color:#0B1410}.btn.ghost{background:var(--card);color:var(--green);border:2px solid var(--green)}.btn.danger{background:var(--card);color:var(--bad);border:2px solid var(--bad)}.btn.white{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.card>.btn.sm{align-self:flex-start}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:700;color:var(--mute)}
input,select,textarea{min-height:52px;border-radius:14px;border:2px solid var(--fieldbd);background:var(--field);padding:0 14px;font-size:17px;width:100%}textarea{padding:12px 14px;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
input.sm{min-height:40px;font-size:15px;padding:0 10px;border-radius:10px}input.num{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid #E1E5E1;background:var(--card);font-weight:700;cursor:pointer;font-size:14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--grey)}.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--grey)}.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--fieldbd);background:var(--card);font-size:20px;font-weight:800;cursor:pointer}.stepper b{min-width:52px;text-align:center;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-align:left;color:#fff;background:var(--green);padding:8px 10px}th:first-child{border-radius:10px 0 0 0}th:last-child{border-radius:0 10px 0 0}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.num{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:20;max-width:528px;margin:0 auto;background:var(--okbg);color:var(--okink);border-radius:16px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(11,20,16,.15)}.toast.bad{background:var(--badbg);color:var(--badink)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--green)}
.login .card{width:100%;max-width:380px;gap:14px;border-radius:28px;padding:22px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.roles button{min-height:72px;border-radius:16px;border:2px solid #E1E5E1;background:var(--card);font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.roles button span{font-size:11px;font-weight:600;color:var(--mute)}.roles button.on{border-color:var(--green);background:var(--okbg);color:var(--okink)}
.kopt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border-radius:16px;border:2px solid #E3E5DF;background:var(--card);color:var(--ink);cursor:pointer}.kopt.on{background:var(--green);color:#fff;border-color:var(--green)}.kopt .col{flex:1 1 170px}.kopt .pill{margin-left:auto}.kopt.on .pill.grey{background:rgba(255,255,255,.15);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:12px;border:none;background:var(--card);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}.tabs button.on{background:var(--green);color:var(--lime)}
.hdr .back{flex:0 0 auto;width:44px;height:44px}
.hdr .title{overflow-wrap:anywhere}

/* ===== Tahap UX: navigasi, istilah, foto, konfirmasi ===== */
.off{font-size:.78em;font-weight:500;color:var(--mute)}
.link{background:none;border:none;padding:4px 0;color:var(--ok);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;min-height:32px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill i{width:7px;height:7px;border-radius:4px;display:inline-block;background:currentColor}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard.wide{width:auto}
.leg{display:inline-flex;align-items:center;gap:5px;color:var(--mute)}.leg i{width:10px;height:4px;border-radius:2px;display:inline-block}.leg i.g{background:var(--green)}.leg i.o{background:var(--warn)}
.kpi{font:inherit;color:inherit;cursor:default}button.kpi{cursor:pointer}
.tiles .tile svg{width:26px;height:26px}
.inset{background:var(--bg);border-radius:12px;padding:10px 12px}
/* RAB: kartu per pekerjaan, bukan tabel */
.rablist{display:flex;flex-direction:column;gap:8px}
.rabrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.rabrow:first-child{border-top:none}
@media(max-width:560px){.rabrow{grid-template-columns:minmax(0,1fr) auto}.rabrow>input{grid-column:1/-1}}
/* tombol foto besar */
.photoBtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:18px;border:2px dashed var(--green);background:var(--okbg);color:var(--green);font-weight:800;font-size:17px;cursor:pointer}
.photoBtn input{display:none}
.pthumb{position:relative;display:inline-block}.pthumb img{width:80px;height:80px;object-fit:cover;border-radius:12px;display:block}
.pthumb button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:14px;border:2px solid #fff;background:var(--bad);color:#fff;font-weight:800;cursor:pointer;line-height:1}
/* foto dengan cadangan bila gagal dimuat */
.ph{display:inline-flex;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--grey);flex:0 0 auto;align-items:center;justify-content:center;text-decoration:none}
.ph img{width:100%;height:100%;object-fit:cover}.ph.sm{width:40px;height:40px;border-radius:10px}
.ph.broken img{display:none}.ph.broken::after{content:"📷";font-size:20px;opacity:.5}
/* kotak konfirmasi */
.modal{position:fixed;inset:0;z-index:50;background:rgba(11,20,16,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(11,20,16,.3)}
@media(min-width:700px){.modal{align-items:center}}
.btn.red{background:var(--bad);color:#fff}
input.err{border-color:var(--bad)}
/* pesan singkat di atas, tidak menutupi tombol */
.toast{top:12px;bottom:auto}
#busy{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--green);color:var(--lime);text-align:center;font-weight:700;font-size:13px;padding:8px}
body.busy #app{pointer-events:none;opacity:.75}
/* layar "terkirim" */
.sent{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 16px 24px;color:var(--ok)}
.sent h1{color:var(--ink);font-size:26px}.sent span{color:var(--mute);font-size:15px;max-width:340px}
.sent.warn{color:var(--warn)}
/* Admin: sidebar di layar lebar, nav bawah di HP */
.shell.desk .nav{display:none}
@media(max-width:899px){.shell.desk .side{display:none}.shell.desk .nav{display:grid}.shell.desk .page{padding:16px 16px 120px;max-width:560px}}
.btn:disabled{background:#C9CFCA;color:#5B665F}
/* ===== struktur, interior, harga fair ===== */
.introw{display:flex;flex-direction:column;gap:6px}
.chip.sm{min-height:34px;padding:0 10px;font-size:12px;border-radius:10px}
.fairbar{position:relative;height:14px;border-radius:7px;background:var(--grey);overflow:hidden;margin-top:4px}
.fairbar .zone{position:absolute;top:0;bottom:0}.fairbar .zone.bad{background:#F6B9B5}.fairbar .zone.ok{background:#BFE6A0}.fairbar .zone.warn{background:#FCDDA0}
.fairbar i{position:absolute;top:-2px;width:4px;height:18px;margin-left:-2px;background:var(--ink);border-radius:2px}
select.sm{min-height:40px;font-size:14px;padding:0 8px;border-radius:10px}
.rabrow.src{grid-template-columns:minmax(0,1fr) auto auto}

</style>
</head>
<body>
<div id="app"><div class="center muted">Memuat Buku Proyek…</div></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Adapter data untuk versi web (claude.ai Artifact): penyimpanan db + assets, hitungan di sisi klien.
   Antarmuka sama dengan public/api.js. Dibangun jadi satu file HTML oleh web/build.js. */
'use strict';
window.API = (() => {
  let dbh = null, assetsh = null, user = null;
  const D = { config: null, matrix: null, log: [], projects: [], attendance: [], reports: [], notas: [], invoices: [] };
  const DEFAULT_CFG = { approvalLimit: 10000000, siteRadiusM: 300, ppn: 0.11, pph: 0.0265, overhead: 0.04, bunga: 0.012 };
  const CFG = () => Object.assign({}, DEFAULT_CFG, D.config || {});
  const now = () => new Date().toISOString();
  const nid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fail = (m) => { throw new Error(m); };

  function prices(matrix) {

function tagihanView() {

    const s = p.summary, invs = S.invoices.filter((i) => i.projectId === p.id);
    const terms = [{ n: 0, label: 'Uang muka (DP ' + Math.round(p.dp * 100) + '%)', atProgress: 0 }].concat(p.termins || []);
    const row = (t) => {
      const inv = invs.find((i) => i.termin === t.n && i.status !== 'void');
      let right, why = '';
      if (inv) { right = '<div class="col right" style="gap:4px"><b>' + rp(inv.transfer) + '</b>' + (inv.status === 'paid' ? pill('Lunas ' + tglD(inv.paidAt), 'ok') : '<button class="btn sm ghost" onclick="A.paid(\'' + inv.id + '\',\'' + esc(inv.label) + '\',' + Math.round(inv.transfer) + ')">Tandai dibayar</button>') + '</div>'; }

      else if (t.n > 0 && s.verified + 1e-9 < t.atProgress) { right = ''; why = 'Bisa ditagih setelah progres diperiksa mencapai ' + Math.round(t.atProgress * 100) + '% (sekarang ' + prog(s.verified) + '). <button class="link" onclick="A.go(\'bukti\')">Cek bukti</button>'; }

  return hdrTitle('Matriks harga pasar', 'Versi ' + esc(S.matrix.version) + ' · ' + tglD(S.matrix.date)) + '<div class="note">' + I.lock + '<span>Nota mandor dibandingkan dengan kolom "Wajar". Di atas kolom "Tinggi" = kemahalan. Ubah angka lalu tekan Simpan di barisnya.</span></div>' +
    '<div class="col" style="gap:8px">' + S.matrix.items.map((it) => card('<div class="row between"><div class="col" style="gap:0"><b>' + esc(it.name) + '</b><span class="tiny muted">per ' + esc(it.unit) + ' · ' + tglD(it.date) + ' · ' + esc(it.src) + '</span></div></div><div class="grid3"><div class="field"><label class="tiny">Rendah</label><input class="sm num" id="ml-' + it.key + '" inputmode="numeric" value="' + it.low + '"></div><div class="field"><label class="tiny">Wajar</label><input class="sm num b" id="mt-' + it.key + '" inputmode="numeric" value="' + it.typ + '"></div><div class="field"><label class="tiny">Tinggi</label><input class="sm num" id="mh-' + it.key + '" inputmode="numeric" value="' + it.high + '"></div></div><div class="row"><input class="sm grow" id="ms-' + it.key + '" value="' + esc(it.src) + '" aria-label="Sumber harga"><button class="btn sm ghost" onclick="A.saveMx(\'' + it.key + '\')">Simpan</button></div>')).join('') + '</div>';
}

/* ---------- ADMIN ---------- */
function adminDash() {
  const c = counts(), tot = S.projects.reduce((a, p) => ({ k: a.k + p.summary.contract, rec: a.rec + p.summary.receivable, kas: a.kas + p.summary.kas }), { k: 0, rec: 0, kas: 0 });
  const nb = c.notaAdmin + c.unver;
  return hdrWho() + '<div class="grid">' + kpi('Perlu diperiksa', String(nb), 'nota & laporan foto', nb ? 'bad' : 'ok', "A.tab('bukti')") + kpi('Siap ditagih', sh(readyAmount()), '', 'dark', "A.tab('tagihan')") + kpi('Belum dibayar klien', sh(tot.rec), '', '', "A.tab('tagihan')") + kpi('Kas', sh(tot.kas)) + kpi('Nilai kontrak berjalan', sh(tot.k), S.projects.length + ' proyek') + kpi('Matriks harga', S.matrix ? S.matrix.version : '—', S.matrix ? tglD(S.matrix.date) : '', '', "A.go('harga')") + '</div>' +
    '<div class="row wrap"><button class="btn sm" onclick="A.go(\'penawaran\')">Hitung penawaran baru</button><button class="btn sm ghost" onclick="A.tab(\'proyek\')">Semua proyek</button></div>' +
    '<div class="sect"><h2>Proyek</h2></div><div class="plist">' + S.projects.map((p) => pcard(p, true)).join('') + '</div>' +
    card('<h3>Kejadian terakhir</h3><div class="list">' + S.log.slice(0, 10).map((l) => '<div class="small"><b>' + esc(l.who) + '</b> ' + esc(l.text) + ' <span class="tiny muted2">' + tgl(l.ts) + '</span></div>').join('') + '</div>');
}

/* ---------- MANDOR ---------- */
function mandorHome() {
  const p = P(); if (!p) return hdrTitle('Pagi, ' + S.user.name) + card('Belum ada proyek yang ditugaskan.');
  const ab = S.attendance.filter((a) => a.projectId === p.id && a.ts.slice(0, 10) === today()); const masuk = ab.find((a) => a.type === 'masuk'), pulang = ab.find((a) => a.type === 'pulang');
  const items = S.reports.filter((r) => r.projectId === p.id).map((r) => ({ ts: r.ts, t: 'Laporan · ' + r.items.map((it) => (p.divisions[it.div] || {}).name + ' ' + it.pct + '%').join(', '), s: r.photos.length + ' foto', pill: r.verified ? pill('Diverifikasi', 'ok') : pill('Menunggu diperiksa', 'warn') }))
    .concat(S.notas.filter((n) => n.projectId === p.id).map((n) => ({ ts: n.ts, t: 'Nota · ' + (n.desc || n.type) + ' ' + rp(n.amount), s: n.note ? 'Alasan: ' + n.note : '', pill: statusPill(n) }))).sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 15);
  const abCard = masuk ? '<div class="card ' + (masuk.onSite ? 'ok' : 'warn') + '" style="border-radius:24px;padding:18px"><span class="small b" style="opacity:.85">Absensi saya</span><b style="font-size:22px;line-height:1.2">✓ Masuk ' + jam(masuk.ts) + (masuk.onSite ? ' di lokasi' : ' — ' + (masuk.distM == null ? 'tanpa GPS' : masuk.distM + ' m dari proyek')) + '</b><span class="small" style="opacity:.85">' + (masuk.workers ? masuk.workers + ' tukang hadir' : '') + (pulang ? ' · pulang ' + jam(pulang.ts) : '') + '</span>' + (!pulang ? '<button class="btn white" onclick="A.go(\'absen\')">Absen pulang</button>' : '') + '</div>'
    : '<div class="card dark" style="border-radius:24px;padding:18px"><span class="small b" style="color:#A9C7B8">Absensi saya</span><b style="font-size:22px;line-height:1.2">Belum absen hari ini</b><span class="small" style="color:#A9C7B8">Selfie + lokasi. Lapor progres baru bisa setelah absen di lokasi.</span><button class="btn lime" onclick="A.go(\'absen\')">Absen masuk sekarang</button></div>';
  return hdrTitle('Pagi, ' + S.user.name.replace(/^Pak |^Bu /, ''), esc(hariIni()), pill(p.name, 'warn')) + abCard +
    (API.canUpload() ? '' : card('<b>Kirim foto belum aktif</b><span class="small">Minta Owner memberi akun ini akses "dapat mengedit".</span>', 'warn')) +
    '<div class="tiles"><button class="tile lime" onclick="A.go(\'lapor\')">' + I.cam + '<span class="col" style="gap:0"><b class="l">Lapor progres</b><span class="s">foto pekerjaan hari ini</span></span></button><button class="tile" onclick="A.go(\'nota\')">' + I.nota + '<span class="col" style="gap:0"><b class="l">Kirim nota</b><span class="s">belanja & upah</span></span></button></div>' +
    card('<b style="font-size:15px">Kiriman saya</b><div class="list">' + (items.length ? items.map((x) => '<div class="row between"><span class="col grow" style="gap:0"><b class="small">' + esc(x.t) + '</b><span class="tiny muted">' + tgl(x.ts) + (x.s ? ' · ' + esc(x.s) : '') + '</span></span>' + x.pill + '</div>').join('') : '<span class="muted small">Belum ada kiriman.</span>') + '</div>') +
    '<div class="note">' + I.lock + '<span>Akun mandor hanya untuk absen, lapor progres, dan kirim nota proyek ' + esc(p.name) + '.</span></div>';
}
function absenView() {
  const p = P(); const ab = S.attendance.filter((a) => a.projectId === p.id && a.ts.slice(0, 10) === today()); const type = ab.some((a) => a.type === 'masuk') ? 'pulang' : 'masuk';
  return hdrTitle('Absen ' + type, esc(p.name)) + card('<b>1 · Selfie di lokasi proyek</b>' + (sel.selfieUrl ? '<img class="photo" src="' + sel.selfieUrl + '" alt="Selfie">' : '') + photoBtn(sel.selfieUrl ? 'Ulangi selfie' : 'Ambil selfie', "A.pickOne(this,'selfie')", { capture: 'user' }) +
    (type === 'masuk' ? '<div class="field"><label>2 · Jumlah tukang hadir hari ini</label><input data-k="workers" oninput="A.f(this)" type="number" inputmode="numeric" min="0" placeholder="mis. 14" value="' + esc(sel.form.workers || '') + '"></div>' : '') +
    '<span class="small muted">Lokasi GPS diambil otomatis. Kalau HP bertanya, pilih "Izinkan".</span><button class="btn lime full" onclick="A.absen(\'' + type + '\')"' + (sel.selfie ? '' : ' disabled') + '>Kirim absen</button>' + (sel.selfie ? '' : '<span class="tiny muted" style="text-align:center">Ambil selfie dulu untuk mengaktifkan tombol kirim.</span>'));
}
function laporView() {
  const p = P(); sel.prog = sel.prog || {};
  const idx = p.divisions.map((d, i) => i), running = idx.filter((i) => { const d = p.divisions[i]; return (d.progress > 0 && d.progress < 100) || sel.prog[i] != null; });
  const firstTodo = idx.find((i) => p.divisions[i].progress === 0); if (firstTodo != null && !running.includes(firstTodo)) running.push(firstTodo);
  const shown = sel.allDiv || !running.length ? idx : running, hidden = idx.length - shown.length;
  const files = sel.lfiles || [];
  const urls = (sel.lurls = files.map((f, i) => (sel.lurls && sel.lurls[i] && sel.lurls[i].f === f) ? sel.lurls[i] : { f, u: window.URL.createObjectURL(f) }));
  return hdrTitle('Lapor progres', esc(p.name)) +
    card('<b>1 · Pekerjaan yang dikerjakan</b><span class="tiny muted">Tekan + atau − sesuai keadaan di lapangan.</span><div class="list">' + shown.map((i) => { const d = p.divisions[i], v = sel.prog[i] != null ? sel.prog[i] : d.progress; return '<div class="row between"><div class="col grow" style="gap:0"><b>' + esc(d.name) + '</b><span class="tiny muted">sebelumnya ' + d.progress + '%</span></div><div class="stepper"><button aria-label="Kurangi" onclick="A.step(' + i + ',-5)">−</button><b' + (v !== d.progress ? ' style="color:var(--ok)"' : '') + '>' + v + '%</b><button aria-label="Tambah" onclick="A.step(' + i + ',5)">+</button></div></div>'; }).join('') + '</div>' + (hidden > 0 || sel.allDiv ? '<button class="link" onclick="A.toggleAllDiv()">' + (sel.allDiv ? 'Tampilkan yang sedang dikerjakan saja' : 'Pekerjaan lain (' + hidden + ')') + '</button>' : '')) +
    card('<b>2 · Foto hasil pekerjaan</b><span class="tiny muted">Wajib minimal 1, paling banyak 8 foto.</span>' + (urls.length ? '<div class="thumbs">' + urls.map((x, i) => '<span class="pthumb"><img src="' + x.u + '" alt="Foto ' + (i + 1) + '"><button aria-label="Hapus foto" onclick="A.delPhoto(' + i + ')">×</button></span>').join('') + '</div>' : '') + (files.length < 8 ? photoBtn(files.length ? 'Tambah foto' : 'Ambil foto', 'A.addPhotos(this)', { capture: 'environment', multiple: true }) : '')) +
    card('<b>3 · Catatan (boleh kosong)</b><textarea data-k="catatan" oninput="A.f(this)" placeholder="mis. hujan 2 jam, semen habis">' + esc(sel.form.catatan || '') + '</textarea><button class="btn full" onclick="A.lapor()">Kirim laporan</button>');
}
function notaView() {
  const types = [['material', 'Material'], ['readymix', 'Tiket ready mix'], ['upah', 'Upah tukang'], ['sewa', 'Sewa alat'], ['lain', 'Lain-lain']]; sel.ntype = sel.ntype || 'material'; const F = sel.form;
  if (sel.ntype === 'readymix') { const p = P(), mutus = (p.mutus && p.mutus.length ? p.mutus : []).concat(Object.keys(BETON.MUTU).filter((m) => !(p.mutus || []).includes(m))); return hdrTitle('Tiket ready mix', 'Foto tiket dari sopir truk, isi angkanya') +
    card('<b>1 · Jenis</b><div class="chips">' + types.map((t) => '<button class="chip ' + (sel.ntype === t[0] ? 'on' : '') + '" onclick="A.setNType(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>') +
    card('<b>2 · Foto tiket</b>' + (sel.nfileUrl ? '<img class="photo" src="' + sel.nfileUrl + '" alt="Tiket">' : '') + photoBtn(sel.nfileUrl ? 'Foto ulang' : 'Foto tiket', "A.pickOne(this,'nfile')", { capture: 'environment' })) +
    card('<b>3 · Isi dari tiket</b><div class="field"><label>Mutu beton di tiket</label><select data-k="rmMutu" onchange="A.f(this)">' + mutus.map((m) => '<option' + ((F.rmMutu || mutus[0]) === m ? ' selected' : '') + '>' + m + '</option>').join('') + '</select>' + ((p.mutus || []).length ? '<span class="tiny muted">Rencana di RAB: ' + p.mutus.join(', ') + '</span>' : '') + '</div>' + field('Volume (m³)', 'rmVol', '', { attrs: 'inputmode="decimal" placeholder="mis. 7"' }) + '<div class="grid">' + field('Jam keluar batching plant', 'rmOut', '', { attrs: 'type="time"' }) + field('Jam tiba di lokasi', 'rmArrive', new Date().toTimeString().slice(0, 5), { attrs: 'type="time"' }) + '</div>' + field('Slump (cm, kalau diuji)', 'rmSlump', '', { attrs: 'inputmode="decimal" placeholder="mis. 12"' }) + field('Batching plant', 'shop', '', { attrs: 'placeholder="mis. Ready mix Cikarang"' }) + field('Nominal (isi kalau dibayar di lokasi)', 'amount', '', { attrs: 'inputmode="numeric"' }) + '<span class="tiny muted">Beton yang lebih dari 90 menit di jalan atau mutunya berbeda dari rencana: jangan dicor sebelum ada izin.</span><button class="btn full" onclick="A.nota()">Kirim tiket</button>'); }
  return hdrTitle('Kirim nota', 'Foto nota, isi nominal, Admin yang memeriksa') +
    card('<b>1 · Jenis</b><div class="chips">' + types.map((t) => '<button class="chip ' + (sel.ntype === t[0] ? 'on' : '') + '" onclick="A.setNType(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>') +
    card('<b>2 · Foto nota</b>' + (sel.nfileUrl ? '<img class="photo" src="' + sel.nfileUrl + '" alt="Nota">' : '') + photoBtn(sel.nfileUrl ? 'Foto ulang' : 'Foto nota', "A.pickOne(this,'nfile')", { capture: 'environment' })) +
    card('<b>3 · Isi</b>' + field('Barang / keterangan', 'desc', '', { attrs: 'placeholder="mis. Semen 50 kg"' }) +
      (sel.ntype === 'material' ? '<div class="field"><label>Jenis barang (supaya bisa dibandingkan harga pasar)</label><select data-k="ukey" onchange="A.f(this)"><option value="">— pilih —</option>' + S.catalog.map((c) => '<option value="' + c.key + '"' + (F.ukey === c.key ? ' selected' : '') + '>' + esc(c.name) + ' (per ' + esc(c.unit) + ')</option>').join('') + '</select></div>' + field('Jumlah (sesuai satuan di atas)', 'qty', '', { attrs: 'type="number" inputmode="decimal" placeholder="mis. 120"' }) : '') +
      field('Toko / penerima', 'shop', '') + field('Total nominal (Rp)', 'amount', '', { attrs: 'inputmode="numeric" placeholder="mis. 11040000"' }) + '<button class="btn full" onclick="A.nota()">Kirim ke Admin</button>');
}
function sentView() {
  const s = sel.sent || { title: 'Terkirim', sub: '' };
  return '<div class="sent ' + (s.kind === 'warn' ? 'warn' : '') + '">' + I.ok + '<h1>' + esc(s.title) + '</h1><span>' + esc(s.sub) + '</span></div><button class="btn full" onclick="A.tab(\'home\')">Kembali ke Beranda</button>';
}

/* ---------- render ---------- */
function render() {
  if (booting) { app.innerHTML = '<div class="center muted">Memuat Buku Proyek…</div>'; return; }
  if (bootError) { app.innerHTML = '<div class="center"><div class="card" style="max-width:420px"><h2>Tidak bisa memuat</h2><span class="small muted">' + esc(bootError) + '</span></div></div>'; return; }
  if (!S || !S.user) { app.innerHTML = loginView(); return; }
  const role = S.user.role, c = counts(); let body, nav;
  const shared = { struktur: strukturView, interior: interiorView, proyek: projectsView, detail: projectView, bukti: buktiView, tagihan: tagihanView, laporan: laporanView, penawaran: penawaranView, rab: rabView, tambahkurang: voView, harga: matrixView, menu: menuView };
  if (role === 'mandor') {
    nav = navBar([['home', I.home, [], 'Beranda'], ['absen', I.user, [], 'Absen'], ['nota', I.nota, [], 'Nota'], ['menu', I.menu, [], 'Menu']], ['lapor', I.cam, 'Lapor progres']);
    body = { home: mandorHome, absen: absenView, lapor: laporView, nota: notaView, menu: menuView, terkirim: sentView }[view] || mandorHome;
    app.innerHTML = '<div class="shell"><main class="page">' + body() + '</main>' + nav + '</div>'; return;
  }
  const nb = buktiCount();
  nav = navBar([['home', I.home, [], role === 'admin' ? 'Dasbor' : 'Beranda'], ['proyek', I.proj, ['detail', 'rab', 'tambahkurang', 'struktur', 'interior'], 'Proyek'], ['tagihan', I.bill, [], 'Tagihan'], ['menu', I.menu, ['penawaran', 'laporan', 'harga'], 'Menu']], ['bukti', I.shield, 'Cek bukti', nb]);
  body = Object.assign({ home: role === 'admin' ? adminDash : ownerHome }, shared)[view] || (role === 'admin' ? adminDash : ownerHome);
  if (role === 'admin') {
    const SECS = [['home', 'Dasbor', I.dash, 0, []], ['bukti', 'Cek bukti', small(I.shield), nb, []], ['proyek', 'Proyek', I.proj, c.risk, ['detail', 'rab', 'tambahkurang', 'struktur', 'interior']], ['tagihan', 'Tagihan', I.bill, 0, []], ['laporan', 'Laporan', small(I.chart), 0, []], ['penawaran', 'Konsultan Penawaran', small(I.calc), 0, []], ['harga', 'Matriks harga', I.tag, 0, []], ['menu', 'Pengaturan', I.user, 0, []]];
    const side = '<nav class="side"><div class="brand"><span class="logo">BP</span><span class="col" style="gap:0"><b style="font-size:15px">Buku Proyek</b><span class="tiny" style="color:#A9C7B8">Admin – Finance</span></span></div>' + SECS.map((x) => '<button class="' + (view === x[0] || x[4].includes(view) ? 'on' : '') + '" onclick="A.tab(\'' + x[0] + '\')"><span class="row">' + x[2] + esc(x[1]) + '</span>' + (x[3] ? '<span class="sbadge">' + x[3] + '</span>' : '') + '</button>').join('') + '<div class="me"><span class="tiny" style="color:#A9C7B8">Masuk sebagai</span><div class="mecard"><span class="avatar" style="width:32px;height:32px;font-size:12px;background:#E7ECFF;color:#2A3FB0">' + initials(S.user.name) + '</span><span class="col" style="gap:0"><b class="small">' + esc(S.user.name) + '</b><span class="tiny" style="color:#A9C7B8">Admin – Finance</span></span></div></div></nav>';
    app.innerHTML = '<div class="shell desk">' + side + '<main class="page">' + body() + '</main>' + nav + '</div>'; return;
  }
  app.innerHTML = '<div class="shell"><main class="page">' + body() + '</main>' + nav + '</div>';
}
(async () => {
  const b = document.createElement('div'); b.id = 'busy'; b.hidden = true; b.setAttribute('role', 'status'); document.body.appendChild(b);
  render();
  try { const r = await API.init(); if (r && r.error) bootError = r.error; else { const u = await API.me(); if (u) { S = await API.state(); sel.pid = S.projects[0] && S.projects[0].id; } else if (API.kind === 'artifact') S = await API.state().catch(() => null); } } catch (e) { bootError = e.message; }
  booting = false; render();
})();

</script>
</body>
